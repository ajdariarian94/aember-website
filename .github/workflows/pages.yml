# Builds the site and publishes it on GitHub Pages:
# https://ajdariarian94.github.io/aember-website/
# Runs on every push to main (and by hand); pull requests get the tests and
# the build, without deploying. The unit tests must pass first.
name: Pages

on:
  push:
    branches: [main]
  # Pull requests: tests and build only, no deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time; pull requests run on their own.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s scripts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
